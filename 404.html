<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page not found | Vishnu Sai Jaswanth</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <style>
        :root {
            --bg: #fbf6ea;
            --surface: #fffaee;
            --border: #e8dcc0;
            --text: #2a1a08;
            --muted: #7d5d34;
            --accent: #b1561e;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0c0d12;
                --surface: #16171d;
                --border: #2a2c35;
                --text: #f0ece2;
                --muted: #9a927f;
                --accent: #e0894e;
            }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .wrap { width: 100%; max-width: 560px; text-align: center; }
        .term {
            text-align: left;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.18);
            overflow: hidden;
            margin-bottom: 32px;
        }
        .term-bar {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 11px 14px;
            border-bottom: 1px solid var(--border);
        }
        .dot { width: 11px; height: 11px; border-radius: 50%; }
        .dot.r { background: #ff5f57; }
        .dot.y { background: #febc2e; }
        .dot.g { background: #28c840; }
        .term-title { margin-left: 8px; font-size: 12px; color: var(--muted); font-family: ui-monospace, 'SF Mono', Menlo, monospace; }
        .term-body {
            padding: 20px 18px;
            font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
            font-size: 14px;
            line-height: 1.8;
        }
        .term-body .p { color: var(--accent); }
        .term-body .err { color: var(--muted); }
        h1 {
            font-family: 'Fraunces', Georgia, serif;
            font-size: clamp(2.4rem, 8vw, 3.6rem);
            margin: 0 0 10px;
            letter-spacing: -1px;
        }
        p.sub { color: var(--muted); margin: 0 0 26px; font-size: 1.02rem; }
        .home {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 22px;
            border-radius: 11px;
            background: var(--accent);
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            transition: transform 0.15s ease, filter 0.15s ease;
        }
        .home:hover { transform: translateY(-2px); filter: brightness(1.05); }
    </style>
    <script>
        // Respect the saved theme so the 404 matches the rest of the site.
        try {
            var saved = localStorage.getItem('portfolio-theme');
            if (saved === 'dark') document.documentElement.style.setProperty('color-scheme', 'dark');
        } catch (e) { /* no-op */ }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
</head>
<body>
    <main class="wrap">
        <div class="term" role="img" aria-label="Terminal showing a 404 error">
            <div class="term-bar">
                <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
                <span class="term-title">vishnu@portfolio: ~</span>
            </div>
            <div class="term-body">
                <div><span class="p">$</span> cd <span aria-hidden="true" id="path">/the-page-you-wanted</span></div>
                <div class="err">bash: no such file or directory (404)</div>
                <div><span class="p">$</span> cd ~ &amp;&amp; open portfolio<span class="err"> ▌</span></div>
            </div>
        </div>
        <h1>404</h1>
        <p class="sub">That route doesn't exist — but plenty of good ones do.</p>
        <a class="home" href="/">← Back to the portfolio</a>
    </main>
    <script>
        // Show the path they actually tried (read-only, escaped).
        try {
            var el = document.getElementById('path');
            var raw = (location.pathname + location.search) || '/';
            el.textContent = raw.length > 42 ? raw.slice(0, 42) + '…' : raw;
        } catch (e) { /* no-op */ }
    </script>
</body>
</html>
